[general]
static=yes
writeprotect=yes

; Outbound escalation calls. The bridge's .call file drops the answered call
; here with ESC_ID set.
[escalation]
exten => s,1,Answer()
 same => n,Wait(1)
 ; Play the alert the bridge pre-rendered with Piper (alert-<id>.sln16).
 same => n,Playback(escalation/alert-${ESC_ID})
 ; Hand the live call to the Node bridge: it records your reply, transcribes
 ; it, and asks you to confirm before doing anything.
 same => n,AGI(agi://127.0.0.1:4573/escalation,${ESC_ID})
 same => n,Hangup()

; Numbers you can dial FROM the phone - handy for testing.
[from-mobile]
; 600 = echo test: you should hear yourself. Proves SIP + audio both work.
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 601 = hear the most recent alert again.
exten => 601,1,Answer()
 same => n,Playback(escalation/alert-latest)
 same => n,Hangup()
